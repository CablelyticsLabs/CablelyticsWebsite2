# ============================================================================
# NETLIFY CONFIGURATION
# This file tells Netlify how to publish the site. For a static site like this,
# there's no build step — Netlify just serves the files as-is.
# ============================================================================
[build]
  publish = "."        # Serve files from the project root (index.html is here)

# Security + caching headers (optional, sensible defaults)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
